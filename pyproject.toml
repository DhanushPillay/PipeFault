[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipefault"
version = "0.1.0"
description = "Fault-injection benchmark for operator-level data defects in streaming ML pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "PipeFault" }]
dependencies = [
  "duckdb>=1.2",
  "kaggle>=1.6",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "polars>=1.20",
  "pyarrow>=18.0",
  "pydantic-settings>=2.7",
  "rich>=13.9",
  "structlog>=25.1",
  "typer>=0.15",
]

[project.optional-dependencies]
ml = [
  "lightgbm>=4.5",
  "mlflow>=2.19",
  "numpy>=2.0",
  "scikit-learn>=1.6",
]
serve = [
  "fastapi>=0.115",
  "streamlit>=1.41",
  "uvicorn[standard]>=0.34",
]
dev = [
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
pipefault = "pipefault.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pipefault"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "paper", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kaggle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires network access or downloaded data",
]

[tool.coverage.run]
source = ["src/pipefault"]

[tool.coverage.report]
omit = ["src/pipefault/__init__.py"]
